<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Wasim Sarwar, Senior Full-Stack Web Developer">
  <defs>
    <clipPath id="round"><rect width="1200" height="300" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <style>
      .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#round)">

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)"/>

  <!-- Left: identity -->
  <text x="64" y="84" class="mono" font-size="16" fill="#2DD4BF">// full-stack web developer</text>
  <text x="62" y="146" class="sans" font-size="58" font-weight="700" fill="#F1F5F9">Wasim Sarwar</text>
  <text x="64" y="186" class="sans" font-size="21" font-weight="600" fill="#CBD5E1">Senior Full-Stack Web Developer</text>
  <text x="64" y="218" class="sans" font-size="17" fill="#94A3B8">Laravel · PHP · Vue.js · Nuxt · React</text>
  <text x="64" y="246" class="sans" font-size="17" fill="#94A3B8">APIs, payment integrations &amp; scalable web platforms</text>
  <circle cx="70" cy="271" r="4" fill="#2DD4BF" class="pulse"/>
  <text x="82" y="276" class="mono" font-size="13" fill="#64748B">Lahore, Pakistan · exploring AI engineering &amp; LLMs</text>

  <!-- Right: API window -->
  <g transform="translate(700,48)">
    <rect width="440" height="206" rx="12" fill="#0B1220" stroke="#1E293B"/>
    <rect width="440" height="34" rx="12" fill="#111A2B"/>
    <rect y="22" width="440" height="12" fill="#111A2B"/>
    <circle cx="20" cy="17" r="5" fill="#F87171"/>
    <circle cx="38" cy="17" r="5" fill="#FBBF24"/>
    <circle cx="56" cy="17" r="5" fill="#34D399"/>
    <text x="220" y="22" text-anchor="middle" class="mono" font-size="12" fill="#64748B">api.request</text>

    <text x="22" y="64" class="mono" font-size="14"><tspan fill="#2DD4BF" font-weight="700">POST</tspan><tspan fill="#E2E8F0"> /api/v1/checkout</tspan></text>
    <text x="22" y="90" class="mono" font-size="13" fill="#64748B">{ "gateway": <tspan fill="#FBBF24">"stripe"</tspan>, "amount": <tspan fill="#818CF8">4900</tspan> }</text>
    <line x1="22" y1="106" x2="418" y2="106" stroke="#1E293B"/>
    <text x="22" y="130" class="mono" font-size="14"><tspan fill="#34D399" font-weight="700">201</tspan><tspan fill="#E2E8F0"> Created</tspan><tspan fill="#64748B">  · 142 ms</tspan><tspan fill="#2DD4BF" class="cursor"> ▍</tspan></text>

    <g class="sans" font-size="12" font-weight="600">
      <rect x="22" y="152" width="62" height="26" rx="13" fill="#1E293B"/><text x="53" y="169" text-anchor="middle" fill="#A5B4FC">Stripe</text>
      <rect x="92" y="152" width="66" height="26" rx="13" fill="#1E293B"/><text x="125" y="169" text-anchor="middle" fill="#7DD3FC">PayPal</text>
      <rect x="166" y="152" width="92" height="26" rx="13" fill="#1E293B"/><text x="212" y="169" text-anchor="middle" fill="#5EEAD4">MyFatoorah</text>
      <rect x="266" y="152" width="78" height="26" rx="13" fill="#1E293B"/><text x="305" y="169" text-anchor="middle" fill="#FCA5A5">JazzCash</text>
      <rect x="352" y="152" width="66" height="26" rx="13" fill="#1E293B"/><text x="385" y="169" text-anchor="middle" fill="#C4B5FD">STC Pay</text>
    </g>
  </g>
  </g>
</svg>
