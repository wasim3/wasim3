<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Thanks for visiting">
  <defs>
    <clipPath id="round"><rect width="1200" height="120" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <style>
      .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    </style>
  </defs>
  <g clip-path="url(#round)">
  <rect width="1200" height="120" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <text x="600" y="58" text-anchor="middle" class="sans" font-size="24" font-weight="600" fill="#E2E8F0">Thanks for visiting</text>
  <text x="600" y="88" text-anchor="middle" class="mono" font-size="14" fill="#64748B">return response()-&gt;json(['status' =&gt; 'open to new opportunities'], 200);</text>
  </g>
</svg>
